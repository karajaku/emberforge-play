<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101b1c" />
    <title>잿불 대장간 · Emberforge</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="style.css?v=1.20" />
    <link rel="stylesheet" href="workshop.css?v=1.20" />
    <link rel="stylesheet" href="story.css?v=1.20" />
    <link rel="stylesheet" href="mobile.css?v=1.20" />
    <link rel="stylesheet" href="combat.css?v=1.20" />
    <link rel="stylesheet" href="feedback.css?v=1.20" />
  </head>
  <body>
    <header>
      <div class="headwrap">
        <a class="brand" href="#forge" aria-label="잿불 대장간 홈"
          ><span class="sigil" id="brandIcon"></span
          ><span>EMBERFORGE<small>잿불 대장간</small></span></a
        >
        <div class="resources">
          <span class="wallet" title="보유 골드"
            ><i id="coinIcon"></i><b id="gold"></b><small>G</small></span
          ><button
            class="round"
            data-open="settings"
            aria-label="환경 설정"
            id="settingsIcon"
          ></button>
        </div>
      </div>
    </header>
    <main>
      <div id="title"></div>
      <nav id="pageNav" aria-label="현재 지역의 화면" hidden></nav>
      <div id="screen"></div>
    </main>
    <aside id="apprentice" aria-label="대장장이 수업 안내" hidden></aside>
    <nav id="mobileNav" aria-label="게임 메뉴"></nav>
    <div id="shade" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="dialog-head">
          <h2 id="modalTitle"></h2>
          <button class="round" data-close aria-label="닫기">×</button>
        </div>
        <div id="modalBody"></div>
      </section>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="icons.js?v=1.20"></script>
    <script src="swordcraft.js?v=1.20"></script>
    <script src="breakthrough.js?v=1.20"></script>
    <script src="charcoal-story.js?v=1.20"></script>
    <script src="game.js?v=1.20"></script>
    <script src="apprentice.js?v=1.20"></script>
    <script src="views.js?v=1.20"></script>
    <script src="craft-view.js?v=1.20"></script>
    <script src="final-view.js?v=1.20"></script>
    <script src="effects.js?v=1.20"></script>
    <script src="sound.js?v=1.20"></script>
    <script src="feedback.js?v=1.20"></script>
    <script src="combat-hud.js?v=1.20"></script>
    <script src="story-view.js?v=1.20"></script>
    <script src="mobile.js?v=1.20"></script>
    <script src="ui.js?v=1.20"></script>
  </body>
</html>
